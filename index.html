<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#020604">
<title>Rorito India • App Catalog</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

:root{
  --bg:#020604;
  --panel:#07100b;
  --panel2:#0a1510;
  --border:#193023;
  --green:#35f27b;
  --green2:#19c95b;
  --text:#eef8f1;
  --muted:#718178;
}

body{
  background:
    radial-gradient(circle at 15% 0%,rgba(35,255,110,.09),transparent 30%),
    radial-gradient(circle at 90% 30%,rgba(0,255,120,.05),transparent 25%),
    var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-height:100vh;
}

/* BACKGROUND EFFECT */

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(60,255,130,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(60,255,130,.025) 1px,transparent 1px);
  background-size:45px 45px;
  mask-image:linear-gradient(to bottom,#000,transparent);
}

/* HEADER */

.header{
  width:min(1180px,calc(100% - 28px));
  margin:auto;
  padding:30px 0 0;
}

.nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 17px;
  border:1px solid var(--border);
  border-radius:18px;
  background:rgba(5,13,8,.8);
  backdrop-filter:blur(15px);
  box-shadow:0 0 35px rgba(0,255,100,.04);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand img{
  width:45px;
  height:45px;
  object-fit:cover;
  border-radius:13px;
  border:1px solid #285a38;
  box-shadow:0 0 20px rgba(53,242,123,.2);
}

.brand strong{
  font-size:17px;
}

.brand small{
  display:block;
  color:#6d7d73;
  font:10px monospace;
  letter-spacing:2px;
  margin-top:2px;
}

.nav-status{
  color:var(--green);
  font:11px monospace;
  letter-spacing:2px;
}

.nav-status span{
  display:inline-block;
  width:7px;
  height:7px;
  background:var(--green);
  border-radius:50%;
  margin-right:7px;
  box-shadow:0 0 12px var(--green);
  animation:pulse 1.5s infinite;
}

/* HERO */

.wrap{
  width:min(1180px,calc(100% - 28px));
  margin:auto;
  padding:70px 0;
}

.kicker{
  color:var(--green);
  font:600 11px monospace;
  letter-spacing:5px;
  margin-bottom:20px;
}

.hero{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:30px;
  margin-bottom:42px;
}

h1{
  font-size:clamp(44px,7vw,78px);
  letter-spacing:-4px;
  line-height:.9;
}

.hero p{
  color:#76847b;
  margin-top:20px;
  max-width:600px;
  line-height:1.6;
}

.stats{
  display:flex;
  gap:12px;
}

.stat{
  border:1px solid var(--border);
  background:#071009;
  padding:14px 18px;
  border-radius:14px;
  min-width:105px;
}

.stat b{
  display:block;
  font-size:22px;
  color:var(--green);
}

.stat span{
  color:#647269;
  font:10px monospace;
  letter-spacing:1px;
}

/* SEARCH */

.tools{
  display:flex;
  gap:10px;
  margin-bottom:24px;
}

.search{
  flex:1;
  height:52px;
  border:1px solid var(--border);
  border-radius:15px;
  outline:none;
  background:#071009;
  color:white;
  padding:0 18px;
  font-size:14px;
}

.search:focus{
  border-color:#277a42;
  box-shadow:0 0 20px rgba(53,242,123,.08);
}

select{
  width:150px;
  border:1px solid var(--border);
  border-radius:15px;
  background:#071009;
  color:#aebbb2;
  padding:0 15px;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

/* CARD */

.card{
  position:relative;
  overflow:hidden;
  border:1px solid var(--border);
  background:
    linear-gradient(145deg,rgba(9,24,15,.96),rgba(3,10,6,.98));
  border-radius:20px;
  padding:23px;
  transition:.3s;
}

.card:after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  right:-100px;
  top:-100px;
  background:var(--green);
  opacity:.025;
  filter:blur(30px);
  border-radius:50%;
}

.card:hover{
  transform:translateY(-4px);
  border-color:#285a38;
  box-shadow:
    0 15px 45px rgba(0,0,0,.35),
    0 0 30px rgba(53,242,123,.06);
}

.top{
  display:flex;
  gap:15px;
  align-items:center;
}

.icon{
  width:67px;
  height:67px;
  flex:none;
  border-radius:17px;
  overflow:hidden;
  background:#101913;
  border:1px solid #26382c;
  display:grid;
  place-items:center;
}

.icon img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.icon-fallback{
  font-size:29px;
}

.meta{
  min-width:0;
}

.badges{
  display:flex;
  gap:7px;
  margin-bottom:7px;
}

.badge{
  border:1px solid #294233;
  color:#819189;
  border-radius:20px;
  padding:4px 9px;
  font:10px monospace;
  letter-spacing:1px;
}

.version{
  color:#66756c;
  font:10px monospace;
  padding-top:5px;
}

.title{
  font-size:19px;
  font-weight:650;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.status{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:17px;
  color:#708078;
  font:10px monospace;
  letter-spacing:1.5px;
}

.live{
  color:var(--green);
}

.dot{
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
  margin-right:7px;
  box-shadow:0 0 12px var(--green);
  animation:pulse 1.7s infinite;
}

.time{
  color:#536158;
}

.line{
  height:1px;
  background:#18291e;
  margin:18px 0;
}

.info{
  display:flex;
  justify-content:space-between;
  color:#829087;
  font:10px monospace;
  letter-spacing:1.5px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:19px;
}

button{
  cursor:pointer;
  transition:.2s;
}

.install{
  grid-column:1/-1;
  height:48px;
  border:0;
  border-radius:13px;
  background:linear-gradient(135deg,#43ed80,#27c965);
  color:#031008;
  font:800 13px monospace;
  letter-spacing:2px;
  box-shadow:0 0 20px rgba(53,242,123,.08);
}

.install:hover{
  box-shadow:0 0 28px rgba(53,242,123,.2);
  transform:translateY(-1px);
}

.secondary{
  height:44px;
  border:1px solid #23372a;
  background:#071009;
  border-radius:12px;
  color:#bac5be;
  font:10px monospace;
  letter-spacing:1.5px;
}

.secondary:hover{
  border-color:#398451;
  color:var(--green);
}

/* FOOTER */

footer{
  text-align:center;
  padding:45px 0 20px;
  color:#455249;
  font:10px monospace;
  letter-spacing:2px;
}

footer strong{
  color:#64736a;
}

/* ANIMATION */

@keyframes pulse{
  0%,100%{
    opacity:1;
    transform:scale(1);
  }
  50%{
    opacity:.45;
    transform:scale(.8);
  }
}

/* MOBILE */

@media(max-width:780px){

  .header{
    padding-top:15px;
  }

  .nav-status{
    display:none;
  }

  .wrap{
    padding-top:48px;
  }

  .hero{
    display:block;
  }

  h1{
    letter-spacing:-3px;
  }

  .stats{
    margin-top:28px;
  }

  .stat{
    flex:1;
  }

  .tools{
    display:grid;
    grid-template-columns:1fr;
  }

  select{
    width:100%;
    height:50px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .card{
    padding:20px;
  }
}
</style>
</head>

<body>

<header class="header">

<nav class="nav">

<div class="brand">
<img src="rorito.png" alt="Rorito Dev">
<div>
<strong>RORITO INDIA</strong>
<small>DEVELOPMENT CATALOG</small>
</div>
</div>

<div class="nav-status">
<span></span>SYSTEM ONLINE
</div>

</nav>

</header>


<main class="wrap">

<div class="kicker">
01 / THE CATALOG
</div>

<section class="hero">

<div>
<h1>Latest<br>Releases</h1>

<p>
A premium application catalog by
<strong>Rorito Dev</strong>.
Fast releases, clean interface and a
mobile-first experience.
</p>
</div>

<div class="stats">

<div class="stat">
<b id="liveCount">60</b>
<span>LIVE APPS</span>
</div>

<div class="stat">
<b>08</b>
<span>REGIONS</span>
</div>

</div>

</section>


<div class="tools">

<input
id="search"
class="search"
placeholder="Search applications..."
oninput="renderApps()"
>

<select id="region" onchange="renderApps()">
<option value="ALL">ALL REGIONS</option>
<option value="INDIA">INDIA</option>
<option value="GLOBAL">GLOBAL</option>
<option value="ASIA">ASIA</option>
<option value="EU">EUROPE</option>
</select>

</div>


<section id="grid" class="grid"></section>


<footer>
© 2026 <strong>RORITO DEV</strong> · RORITO INDIA · ALL RIGHTS RESERVED
</footer>

</main>


<script>

*/

function iconHTML(icon,name){

/*
  Simple Icons CDN gives many applications
  their recognizable logos.

  If an icon isn't available, the emoji/text
  fallback is displayed.
*/

const slug={
  "Instagram":"instagram",
  "WhatsApp":"whatsapp",
  "Telegram":"telegram",
  "YouTube":"youtube",
  "Discord":"discord",
  "Spotify":"spotify",
  "Netflix":"netflix",
  "Pinterest":"pinterest",
  "X":"x",
  "Facebook":"facebook",
  "Google":"google",
  "Chrome":"googlechrome",
  "Gmail":"gmail",
  "Google Drive":"googledrive",
  "Google Maps":"googlemaps",
  "Google Photos":"googlephotos",
  "Google Docs":"googledocs",
  "Google Meet":"googlemeet",
  "Google Pay":"googlepay",
  "Amazon":"amazon",
  "Flipkart":"flipkart",
  "Paytm":"paytm",
  "PhonePe":"phonepe",
  "Swiggy":"swiggy",
  "Zomato":"zomato",
  "Reddit":"reddit",
  "Twitch":"twitch",
  "LinkedIn":"linkedin",
  "Snapchat":"snapchat",
  "TikTok":"tiktok",
  "CapCut":"capcut",
  "Canva":"canva",
  "Zoom":"zoom",
  "Microsoft Teams":"microsoftteams",
  "OneDrive":"onedrive",
  "Dropbox":"dropbox",
  "Notion":"notion",
  "GitHub":"github",
  "GitLab":"gitlab"
};

if(slug[name]){
  return `
  <img
  src="https://cdn.simpleicons.org/${slug[name]}"
  alt="${name}"
  onerror="this.style.display='none';this.nextElementSibling.style.display='block'"
  >
  <span class="icon-fallback" style="display:none">${icon}</span>
  `;
}

return `<span class="icon-fallback">${icon}</span>`;
}


function renderApps(){

const search=
document.getElementById("search").value.toLowerCase();

const region=
document.getElementById("region").value;

const grid=
document.getElementById("grid");

const filtered=apps.filter(app=>{

const name=app[0].toLowerCase();

const matchesSearch=name.includes(search);

const matchesRegion=
region==="ALL" || app[1]===region;

return matchesSearch && matchesRegion;

});

document.getElementById("liveCount").textContent=filtered.length;

grid.innerHTML=filtered.map((app,index)=>{

const name=app[0];
const region=app[1];
const version=app[2];
const time=app[3];
const icon=app[4];

return `

<article class="card">

<div class="top">

<div class="icon">
${iconHTML(icon,name)}
</div>

<div class="meta">

<div class="badges">
<span class="badge">${region}</span>
<span class="version">${version}</span>
</div>

<div class="title">${name}</div>

</div>

</div>


<div class="status">

<span class="live">
<span class="dot"></span>
LIVE RELEASE
</span>

<span class="time">${time}</span>

</div>


<div class="line"></div>


<div class="info">
<span>RORITO AUTHORIZED</span>
<span>READY</span>
</div>


<div class="actions">

<button
class="install"
onclick="installApp('${name}')">
INSTALL
</button>

<button
class="secondary"
onclick="downloadApp('${name}')">
DOWNLOAD IPA
</button>

<button
class="secondary"
onclick="copyAppLink('${name}')">
COPY LINK
</button>

</div>

</article>

`;

}).join("");

}


function installApp(name){

alert(
name+
" installation link is not configured yet."
);

}


function downloadApp(name){

alert(
name+
" download link is not configured yet."
);

}


function copyAppLink(name){

const url=location.href+"#"+encodeURIComponent(name);

navigator.clipboard?.writeText(url);

alert("Rorito link copied!");

}


renderApps();

</script>
