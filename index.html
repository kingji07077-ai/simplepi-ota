<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#03070b">
<title>SimplePi • Latest Releases</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

body{
  background:#03070b;
  color:#eef4f8;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

.wrap{
  width:min(1180px,calc(100% - 40px));
  margin:auto;
  padding:68px 0 70px
}

.catalog{
  color:#35e879;
  font:600 12px monospace;
  letter-spacing:5px;
  margin-bottom:22px
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:25px;
  margin-bottom:52px
}

h1{
  font-size:clamp(44px,6vw,72px);
  line-height:.95;
  letter-spacing:-3px
}

.count{
  color:#7f8b95;
  font:12px monospace;
  letter-spacing:3px
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:22px
}

.card{
  border:1px solid #202b35;
  background:linear-gradient(145deg,#071017,#050a0f);
  border-radius:22px;
  padding:30px
}

.top{
  display:flex;
  align-items:center;
  gap:18px
}

.icon{
  width:72px;
  height:72px;
  flex:none;
  border-radius:18px;
  background:#18222b;
  display:grid;
  place-items:center;
  font-size:32px;
  overflow:hidden
}

.icon img{
  width:100%;
  height:100%;
  object-fit:cover
}

.meta{
  min-width:0
}

.badges{
  display:flex;
  gap:9px;
  margin-bottom:10px
}

.badge{
  border:1px solid #293642;
  border-radius:20px;
  padding:5px 11px;
  color:#8e9aa5;
  font:11px monospace;
  letter-spacing:1px
}

.ver{
  color:#82909c;
  font:12px monospace
}

.title{
  font-size:21px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.status{
  margin-top:18px;
  display:flex;
  gap:9px;
  align-items:center;
  color:#71808b;
  font:12px monospace;
  letter-spacing:2px
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#3be879;
  box-shadow:0 0 10px #3be879
}

.line{
  height:1px;
  background:#202b35;
  margin:25px 0
}

.info{
  display:flex;
  justify-content:space-between;
  color:#9ba7b0;
  font:12px monospace;
  letter-spacing:2px
}

.install{
  width:100%;
  height:54px;
  border:0;
  border-radius:15px;
  margin-top:25px;
  background:#3dd875;
  color:#031007;
  font:800 15px monospace;
  letter-spacing:2px
}

.secondary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px
}

.secondary button{
  height:48px;
  border-radius:14px;
  border:1px solid #26333e;
  background:transparent;
  color:#d5dde2;
  font:12px monospace;
  letter-spacing:2px
}

.coming{
  opacity:.6
}

.coming .dot{
  background:#53616b;
  box-shadow:none
}

.coming .install{
  background:transparent;
  border:1px dashed #26333e;
  color:#53616b
}

footer{
  margin-top:60px;
  padding-top:28px;
  border-top:1px solid #172129;
  text-align:center;
  color:#56636d;
  font:11px monospace;
  letter-spacing:2px
}

@media(max-width:750px){
  .wrap{
    width:calc(100% - 24px);
    padding-top:44px
  }

  .head{
    display:block
  }

  .count{
    margin-top:20px
  }

  .grid{
    grid-template-columns:1fr
  }

  .card{
    padding:22px
  }
}
</style>
</head>

<body>

<div class="wrap">

<div class="catalog">
01 / THE CATALOG
</div>

<div class="head">
<h1>Latest releases</h1>
<div class="count">
1 LIVE · 1 REGION
</div>
</div>

<div class="grid">

<article class="card">

<div class="top">

<div class="icon">
π
</div>

<div class="meta">

<div class="badges">
<span class="badge">GLOBAL</span>
<span class="ver">v1.0</span>
</div>

<div class="title">
SimplePi
</div>

</div>
</div>

<div class="status">
<span class="dot"></span>
LIVE RELEASE
</div>

<div class="line"></div>

<div class="info">
<span>AUTHORIZED RELEASE</span>
<span>8.35 MB</span>
</div>

<button class="install" onclick="installApp()">
INSTALL
</button>

<div class="secondary">

<button onclick="downloadApp()">
DOWNLOAD IPA
</button>

<button onclick="copyLink()">
COPY LINK
</button>

</div>

</article>


<article class="card coming">

<div class="top">

<div class="icon">
✦
</div>

<div class="meta">

<div class="badges">
<span class="badge">GLOBAL</span>
<span class="ver">v2.0</span>
</div>

<div class="title">
New Release
</div>

</div>
</div>

<div class="status">
<span class="dot"></span>
COMING SOON
</div>

<div class="line"></div>

<div class="info">
<span>NOT YET AVAILABLE</span>
<span>COMING SOON</span>
</div>

<button class="install" disabled>
COMING SOON
</button>

</article>

</div>

<footer>
SIMPLEPI · RELEASE CATALOG · 2026
</footer>

</div>


<script>

const INSTALL_URL="";
const IPA_URL="";

function installApp(){

if(!INSTALL_URL)
return alert("Add your authorized installation URL in index.html");

location.href=INSTALL_URL;

}

function downloadApp(){

if(!IPA_URL)
return alert("Add your authorized IPA URL in index.html");

location.href=IPA_URL;

}

function copyLink(){

navigator.clipboard?.writeText(
INSTALL_URL || location.href
);

alert("Link copied");

}

</script>

</body>
</html>
